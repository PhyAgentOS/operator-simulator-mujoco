[project]
name = "mujoco-sim"
version = "1.1.1"
description = "Standalone MuJoCo simulator node for Dora robotics dataflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "X-ERA" },
]
keywords = ["mujoco", "simulation", "dora", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dora-rs==0.4.1",
    "forge-common>=1.0.0,<2",
    "forge-msgs>=1.0.0,<2",
    "mujoco==3.3.7",
    "numpy>=2.0.0",
    "opencv-python",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Forgelab-Robotics/operator-simulator-mujoco"
Repository = "https://github.com/Forgelab-Robotics/operator-simulator-mujoco"
Documentation = "https://github.com/Forgelab-Robotics/operator-simulator-mujoco#readme"
Issues = "https://github.com/Forgelab-Robotics/operator-simulator-mujoco/issues"

[project.scripts]
mujoco_sim = "mujoco_sim.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
build = [
    "pyinstaller>=6.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_sim"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
