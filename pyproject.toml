[project]
name = "mujoco-sim"
version = "1.0.0"
description = "Standalone MuJoCo simulator node for Forge dataflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dora-rs==0.4.1",
    "forge-common>=1.0.0,<2",
    "forge-msgs>=1.0.0,<2",
    "mujoco==3.3.7",
    "numpy>=2.0.0",
    "opencv-python",
    "pyyaml>=6.0",
]

[project.scripts]
mujoco_sim = "mujoco_sim.main:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
build = [
    "pyinstaller>=6.18.0",
]

[tool.uv.sources]
forge-common = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-common-v1.0.0", subdirectory = "packages/common" }
forge-msgs = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-msgs-v1.0.0", subdirectory = "packages/msgs" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_sim"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
