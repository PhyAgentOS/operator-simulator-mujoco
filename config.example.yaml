# MuJoCo 节点配置示例
# 复制为 config.yaml 并根据实际环境修改
#
# 渲染后端（环境变量，须在启动前设置）：默认 egl（无显示器/服务器友好）
#   MUJOCO_GL=egl   - 无头 GPU 渲染（推荐）
#   MUJOCO_GL=osmesa - 软件渲染（无 GPU，需 libOSMesa）
#   MUJOCO_GL=glfw  - 需要显示器/窗口
#
# 时间与频率：control_hz 为控制周期频率，需与 dataflow 中 mujoco 的 tick 间隔一致（如 50Hz → 20ms）

model_path: ./model.xml

# 控制周期频率（Hz），缺省 50；与 dataflow 中 tick 间隔一致（50 → 20ms）
control_hz: 50

joints:
  - name: j1
    mode: position
    unit: radians
  - name: j2
    mode: position
    unit: radians
  - name: j3
    mode: position
    unit: radians
  # 例如：夹爪由两个 finger joint 合成，可使用派生配置：
  # - name: gripper
  #   mode: prismatic
  #   unit: millimeters
  #   # value_raw = qpos[finger_joint_1] - qpos[finger_joint_2]
  #   # value = value_raw * state_scale （米 → 毫米）
  #   state_from_joints: ["finger_joint_1", "finger_joint_2"]
  #   state_expr: diff        # 或 sum
  #   state_scale: 1000.0     # 缺省 1.0

robots:
  - id: robot_0
    joints: ["j1", "j2"]
  - id: robot_1
    joints: ["j3"]

# RGB 相机输出配置：MuJoCo 模型中的 camera 名称 -> output_id 或 { output, fps }
# 无 fps 时随 tick 输出。camera 名称需与模型 XML 中 camera 的 name 属性一致
# image_format: raw 输出 forge_msgs.Image；jpeg/png 输出 forge_msgs.CompressedImage
# image_jpeg_quality: JPEG 质量（1-100，仅 image_format=jpeg 时生效）
image_format: raw
image_jpeg_quality: 90

# 深度相机输出配置：MuJoCo 模型中的 camera 名称 -> output_id 或 { output, fps }
# 输出 payload 固定为 forge_msgs.Image：
#   encoding: 32FC1
#   dtype: float32
#   unit: meters
# 这样仿真和未来真机 realsense_camera 可以共享同一种 depth 契约；
# RealSense 原始 z16 建议在 camera 节点内根据 depth_scale 转成 meters 后再输出 32FC1。
#
# 示例：将 MuJoCo 中名为 top 的 camera 输出到 dora topic depth/top
depth_forward:
  top: { output: "depth/top", fps: 30, width: 640, height: 480 }

# 可选：输出平面位姿（forge_msgs.PoseSet），输出口固定为 "pose_set"
# 不写 pose_targets 时，会按 robots[].prefix 自动识别每个 robot 的根 body 作为 pose
# pose_targets: {id: body_name}
# - id: 可为 robot_id 或任意自定义 id；若 id 等于 robot_id，会用该 robot 的 prefix 拼接 body_name
# - body_name: MuJoCo XML 中 body 的 name
# pose_targets:
#   robot_0: "base"
#   robot_1: "root"
#   goal: "nav_goal_marker"  # 自定义 id（建议写模型中完整 body name）

image_forward:
  camera/main: { output: "image/main", fps: 30, width: 640, height: 480 }
  camera/wrist: { output: "image/wrist", fps: 15, width: 640, height: 480 }
