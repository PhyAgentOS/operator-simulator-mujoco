# MuJoCo 节点配置示例
# 复制为 config.yaml 并根据实际环境修改
#
# 渲染后端（环境变量，须在启动前设置）：默认 egl（无显示器/服务器友好）
#   MUJOCO_GL=egl   - 无头 GPU 渲染（推荐）
#   MUJOCO_GL=osmesa - 软件渲染（无 GPU，需 libOSMesa）
#   MUJOCO_GL=glfw  - 需要显示器/窗口
#
# 时间与频率：control_hz 为控制周期频率，需与 dataflow 中 mujoco 的 tick 间隔一致（如 50Hz → 20ms）

model_path: ./model.xml  # MuJoCo XML 场景路径；可用相对路径或绝对路径。

# 控制周期频率（Hz），缺省 50；与 dataflow 中 tick 间隔一致（50 → 20ms）
control_hz: 50

# 可选：使用 forge_msgs.LocomotionCommand 驱动一个 MuJoCo mocap body 做平面运动。
# body 必须在 MJCF 中设置 mocap="true"；vx/vy 使用机体系 m/s，wz 使用 rad/s。
# command_timeout_sec 按仿真时间计算；超时后自动清零速度。省略时命令保持到下一条命令或 reset_scene。
# kinematic_planar_base:
#   body: mobile_base
#   command_timeout_sec: 0.1

# 可选：场景初始状态，在启动和 reset_scene 后应用。
# joint_positions 的 key 使用全局逻辑关节名，value 单位与 joints[].unit 一致。
# 仅支持 position/prismatic；未列出的关节保留模型 qpos0。
# position actuator 的 ctrl 会按 forward 后的 actuator length 自动同步。
# 后续可在 initial_state 下扩展物体位姿、速度或 MuJoCo keyframe。
initial_state:
  joint_positions:
    j1: 0.2

joints:
  - name: j1        # 输出到 JointState/JointCommand 的逻辑关节名。
    mode: position  # 控制模式；当前常用 position。
    unit: radians   # 单位；旋转关节通常 radians，夹爪等直线关节通常 millimeters。
  - name: j2
    mode: position
    unit: radians
  - name: j3
    mode: position
    unit: radians
  # 例如：夹爪由两个 finger joint 合成，可使用派生配置：
  # - name: gripper
  #   mode: prismatic
  #   unit: millimeters
  #   # value_raw = qpos[finger_joint_1] - qpos[finger_joint_2]
  #   # value = value_raw * state_scale （米 → 毫米）
  #   state_from_joints: ["finger_joint_1", "finger_joint_2"]
  #   state_expr: diff        # 或 sum
  #   state_scale: 1000.0     # 缺省 1.0

robots:
  - id: robot_0
    prefix: item_1/       # 可选；用于按前缀在模型中定位该机器人的 body/joint。
    joints: ["j1", "j2"]  # 该机器人包含的逻辑关节名，顺序决定向量顺序。
    actuator_order: ["j1", "j2"]  # 可选；控制向量中的执行器顺序，省略时与 joints 相同。
    joint_to_actuator: {j1: j1, j2: j2}  # 可选；逻辑关节名 -> MuJoCo actuator 名。
  - id: robot_1
    joints: ["j3"]

# RGB 相机输出配置：MuJoCo 模型中的 camera 名称 -> output_id 或 { output, fps }
# 无 fps 时随 tick 输出。camera 名称需与模型 XML 中 camera 的 name 属性一致
# image_format: raw 输出 forge_msgs.Image；jpeg/png 输出 forge_msgs.CompressedImage
# image_jpeg_quality: JPEG 质量（1-100，仅 image_format=jpeg 时生效）
image_format: raw        # 可选 raw | jpeg | png；raw 输出 forge_msgs.Image，jpeg/png 输出 CompressedImage。
image_jpeg_quality: 90   # JPEG 质量，范围 1-100；仅 image_format=jpeg 时生效。

# 可选：输出平面位姿（forge_msgs.PoseSet），输出口固定为 "pose_set"
# 不写 pose_targets 时，会按 robots[].prefix 自动识别每个 robot 的根 body 作为 pose
# pose_targets: {id: body_name}
# - id: 可为 robot_id 或任意自定义 id；若 id 等于 robot_id，会用该 robot 的 prefix 拼接 body_name
# - body_name: MuJoCo XML 中 body 的 name
# pose_targets:
#   robot_0: "base"
#   robot_1: "root"
#   goal: "nav_goal_marker"  # 自定义 id（建议写模型中完整 body name）

# 图像输出配置：MuJoCo 模型中的 camera 名称 -> output_id、{ output, fps, type } 或输出列表。
# type 缺省为 image，可显式写 image/rgb/color；深度图写 type: depth。
# depth 输出 payload 固定为 forge_msgs.Image：
#   encoding: 32FC1
#   dtype: float32
#   unit: meters
# 这样仿真和真机相机节点可以共享同一种 depth 契约。
image_forward:
  # MuJoCo camera 名称 -> Dora 输出配置。
  # output 必填；fps 省略时随 tick 输出；width/height 省略时使用默认渲染尺寸。
  camera/main: { output: "image/main", fps: 30, width: 640, height: 480 }
  camera/wrist: { output: "image/wrist", fps: 15, width: 640, height: 480 }
  camera/top:
    - { output: "image/top", fps: 30, width: 640, height: 480 }
    - { output: "depth/top", fps: 30, width: 640, height: 480, type: depth }

# 不输出 camera_info，避免把相机内参等静态信息作为高频 Dora topic 传输。
# 需要使用深度图的 policy 应在自身配置中静态填写以下参数：
#   camera_width / camera_height
#   camera_fx / camera_fy / camera_cx / camera_cy
#   depth_min_m / depth_max_m / depth_unit_scale
#
# 参数来源：
# - camera_fx/fy/cx/cy 由 MuJoCo camera 的 focal+sensorsize+resolution 计算；
#   若模型只写 fovy，则按 pinhole 模型由 fovy 和输出 width/height 推导。
# - MuJoCo depth 输出为 forge_msgs.Image encoding=32FC1，单位已经是 meters，
#   因此 depth_unit_scale 应为 1.0。
# - depth_min_m/depth_max_m 是 policy 的有效深度裁剪范围，按任务工作空间设置。
